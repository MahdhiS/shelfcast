models:
  - name: dim_store
    description: "One row per store (54), with the city's coordinates."
    columns:
      - name: store_nbr
        data_tests:
          - unique
          - not_null
      - name: latitude
        description: "From stg_city_coordinates. NULL here means the city join failed."
        data_tests:
          - not_null
      - name: longitude
        data_tests:
          - not_null

  - name: dim_item
    description: "One row per item in the catalogue (4,100), including the 64 never sold."
    columns:
      - name: item_nbr
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: "One row per calendar day, 2013-01-01 to 2017-08-31. Only things known in advance: calendar, paydays, national holidays."
    columns:
      - name: date
        data_tests:
          - unique
          - not_null
      - name: day_of_week
        description: "1 = Monday ... 7 = Sunday (ISO)."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false

  - name: fct_oil_daily
    description: "WTI oil price for every calendar day, last known price carried forward (DI-06, DI-07). Use only past prices as features (DI-08)."
    columns:
      - name: date
        data_tests:
          - unique
          - not_null
      - name: oil_price
        description: "NULL only on 2013-01-01: no earlier price exists to carry forward."
        data_tests:
          - not_null:
              config:
                where: "date > '2013-01-01'"

  - name: dim_place_holidays
    description: "Regional and local holidays, one row per date per place. Join Regional rows on a store's state and Local rows on its city."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - locale
              - locale_name
    columns:
      - name: locale_name
        description: "A province (Regional) or a city (Local)."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: city
              config:
                where: "locale = 'Local'"
          - relationships:
              arguments:
                to: ref('dim_store')
                field: state
              config:
                where: "locale = 'Regional'"

  - name: fct_weather_daily

    description: "Daily max/min temperature and precipitation per city (ERA5). Rain amounts biased in places (DI-22)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - city
              - date
    columns:
      - name: city
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: city
      - name: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date    

  - name: fct_transactions
    description: "Receipts per store per day. A missing row means not recorded, never zero (DI-09, DI-10)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - store_nbr
    columns:
      - name: store_nbr
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_nbr
      - name: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: transaction_count
        data_tests:
          - not_null

  - name: fct_sales
    description: "One row per store, item and day with sales (125,497,040 rows). Returns negative, onpromotion NULL before 2014-04-01, zero-sales days absent (DI-11, DI-13, DI-14)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - store_nbr
              - item_nbr
    columns:
      - name: store_nbr
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_nbr
      - name: item_nbr
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_nbr
      - name: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date

  - name: fct_sales_daily_store_family
    description: "One row per date, store and product family: a summary of fct_sales. unit_sales is an exact decimal sum, returns included as negatives. items_on_promotion is NULL before 2014-04-01 (not recorded, DI-13)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date
              - store_nbr
              - family
    columns:
      - name: family
        description: "From dim_item. NULL here means the item join failed."
        data_tests:
          - not_null 