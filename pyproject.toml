[project]
name = "shelfcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MahdhiS", email = "mahdhi.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-databricks>=1.13.1",
    "dbt-postgres>=1.11.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.9",
    "statsmodels>=0.15.0",
]

[project.scripts]
shelfcast = "shelfcast:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
